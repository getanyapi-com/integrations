[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anyapi-haystack"
version = "0.1.0"
description = "Haystack components and tools for AnyAPI: one key, hundreds of data and scraping APIs, billed per request in USD."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["haystack", "anyapi", "scraping", "agent", "tools", "api"]
authors = [{ name = "AnyAPI", email = "support@getanyapi.com" }]
maintainers = [{ name = "AnyAPI", email = "support@getanyapi.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["haystack-ai>=3.1,<4", "getanyapi>=0.35,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://getanyapi.com"
Documentation = "https://getanyapi.com/docs"
Issues = "https://github.com/getanyapi-com/agent-frameworks/issues"
Source = "https://github.com/getanyapi-com/agent-frameworks"

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "example", "smoke.py", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ARG", "B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]
# Haystack's own integrations pass a Secret default with Secret.from_env_var(...), and
# upstream un-ignores B008 for exactly that pattern. Follow them.
ignore = ["B008"]

[tool.ruff.format]
# _projection.py and _descriptions.py are carried verbatim from the shared template
# that all three AnyAPI agent-framework packages copy. Formatting them here would
# fork them from that source for nothing.
exclude = ["src/haystack_integrations/components/connectors/anyapi/_projection.py", "src/haystack_integrations/components/connectors/anyapi/_descriptions.py"]

[tool.ruff.lint.isort]
known-first-party = ["haystack_integrations"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "example", "smoke.py"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["integration: hits live AnyAPI; skipped unless ANYAPI_API_KEY is set"]
testpaths = ["tests"]
