[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-anyapi"
version = "0.1.0"
description = "LangChain tools for AnyAPI: hundreds of data and scraping APIs behind one key, billed per request in USD."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AnyAPI", email = "support@getanyapi.com" }]
keywords = ["langchain", "anyapi", "tools", "scraping", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["getanyapi>=0.35,<1", "langchain-core>=1.6.1,<2.0.0"]

[project.optional-dependencies]
# The release workflow installs the gate with `pip install -e ".[dev]"`, so the
# test and lint tools live here rather than in a PEP 735 dependency group.
dev = [
  "langchain-tests>=1.1.9,<2.0.0",
  "mypy>=2.0",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "ruff>=0.16",
]

[project.urls]
Homepage = "https://getanyapi.com"
Documentation = "https://getanyapi.com/docs"
Issues = "https://github.com/getanyapi-com/agent-frameworks/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_anyapi"]

[tool.hatch.build.targets.sdist]
include = ["langchain_anyapi", "tests", "smoke.py", "README.md"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# The stand-in clients mirror the SDK's own dynamic signatures.
"tests/**" = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.10"
files = ["langchain_anyapi", "tests", "smoke.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
