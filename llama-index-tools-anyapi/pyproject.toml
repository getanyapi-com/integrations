[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-anyapi"
version = "0.2.0"
description = "llama-index tools anyapi integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AnyAPI", email = "support@getanyapi.com" }]
maintainers = [{ name = "AnyAPI", email = "support@getanyapi.com" }]
keywords = ["anyapi", "llama-index", "scraping", "tools", "agent"]
dependencies = [
    "llama-index-core>=0.14.0,<0.15",
    "getanyapi>=0.36,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://getanyapi.com"
Documentation = "https://getanyapi.com/docs"
Issues = "https://github.com/getanyapi-com/integrations/issues"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.anyapi"

[tool.llamahub.class_authors]
AnyAPIToolSpec = "getanyapi"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["llama_index", "tests", "examples", "smoke.py"]
# llama_index and llama_index/tools are implicit namespace packages with no
# __init__.py, so mypy needs the package root spelled out.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
